version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # MySQL: Database-per-Service isolated persistent storage
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.4
    container_name: order_platform_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
      - mysql_data:/var/lib/mysql
    networks:
      - platform-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -prootpassword || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Identity Service: Authentication, User Profiles, JWT & RBAC
  # ---------------------------------------------------------------------------
  identity-service:
    build:
      context: ./identity-service
      dockerfile: Dockerfile
    container_name: order_platform_identity
    restart: unless-stopped
    environment:
      SERVER_PORT: 8081
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: identity_db
      DB_USERNAME: app_user
      DB_PASSWORD: app_password
      JWT_SECRET: d41d8cd98f00b204e9800998ecf8427e4b5a6c7d8e9f0a1b2c3d4e5f6a7b8c9d
      JWT_EXPIRATION_MS: 86400000
    ports:
      - "${IDENTITY_PORT:-8081}:8081"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - platform-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Catalog & Inventory Service: Products, Categories, Stock Reservation Machine
  # ---------------------------------------------------------------------------
  catalog-inventory-service:
    build:
      context: ./catalog-inventory-service
      dockerfile: Dockerfile
    container_name: order_platform_catalog
    restart: unless-stopped
    environment:
      SERVER_PORT: 8082
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: catalog_db
      DB_USERNAME: app_user
      DB_PASSWORD: app_password
    ports:
      - "${CATALOG_PORT:-8082}:8082"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - platform-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Order Service: Shopping Cart, Synchronous Stock Locking, Atomic Checkout
  # ---------------------------------------------------------------------------
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order_platform_order
    restart: unless-stopped
    environment:
      SERVER_PORT: 8083
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: order_db
      DB_USERNAME: app_user
      DB_PASSWORD: app_password
      CATALOG_SERVICE_URL: http://catalog-inventory-service:8082
    ports:
      - "${ORDER_PORT:-8083}:8083"
    depends_on:
      mysql:
        condition: service_healthy
      catalog-inventory-service:
        condition: service_healthy
    networks:
      - platform-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Delivery Service: Customer Addresses, Rider Fleets & Shipment Lifecycle
  # ---------------------------------------------------------------------------
  delivery-service:
    build:
      context: ./delivery-service
      dockerfile: Dockerfile
    container_name: order_platform_delivery
    restart: unless-stopped
    environment:
      SERVER_PORT: 8084
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: delivery_db
      DB_USERNAME: app_user
      DB_PASSWORD: app_password
    ports:
      - "${DELIVERY_PORT:-8084}:8084"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - platform-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8084/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # API Gateway: Unified Perimeter Proxy, JWT Validation & Claims Forwarding
  # ---------------------------------------------------------------------------
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: order_platform_gateway
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      IDENTITY_SERVICE_URL: http://identity-service:8081
      CATALOG_SERVICE_URL: http://catalog-inventory-service:8082
      ORDER_SERVICE_URL: http://order-service:8083
      DELIVERY_SERVICE_URL: http://delivery-service:8084
      JWT_SECRET: d41d8cd98f00b204e9800998ecf8427e4b5a6c7d8e9f0a1b2c3d4e5f6a7b8c9d
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      identity-service:
        condition: service_healthy
      catalog-inventory-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      delivery-service:
        condition: service_healthy
    networks:
      - platform-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  platform-network:
    driver: bridge

volumes:
  mysql_data:
